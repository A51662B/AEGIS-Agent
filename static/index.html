<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AEGIS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css?v=20261011t" />
</head>
<body>
  <div class="app">
    <!-- 左侧：会话列表 -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <span class="logo-dot"></span>
          <span class="logo-text">AEGIS</span>
        </div>
        <button id="new-session" class="btn-new" title="新建会话">＋</button>
      </div>
      <div class="session-list" id="session-list"></div>
      <div class="sidebar-footer">
        <span class="status-dot"></span>
        <span>本地模型服务</span>
      </div>
    </aside>

    <!-- 中间：对话流 -->
    <main class="chat">
      <div class="chat-scroll" id="chat-scroll">
        <div class="empty-state" id="empty-state">
          <div class="empty-icon">✦</div>
          <p>开始一段新的研究对话</p>
          <p class="empty-hint">支持工具调用 · 流式输出 · 会话记忆</p>
        </div>
      </div>
      <div class="composer">
        <div class="composer-box">
          <textarea id="input" rows="1" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
          <button id="token-ring" class="token-ring" title="上下文用量，点击压缩">
            <svg viewBox="0 0 36 36" width="22" height="22">
              <circle class="ring-track" cx="18" cy="18" r="15" fill="none" stroke-width="3.5"/>
              <circle class="ring-progress" id="ring-progress" cx="18" cy="18" r="15" fill="none" stroke-width="3.5"
                      stroke-linecap="round" stroke-dasharray="94.2" stroke-dashoffset="94.2"
                      transform="rotate(-90 18 18)"/>
            </svg>
          </button>
          <button id="send" class="btn-send" title="发送">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <path d="M4.5 12L20 4l-3.5 16-4.5-5.5L4.5 12z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </div>
    </main>

    <!-- 右侧：工作台 -->
    <aside class="workbench">
      <div class="wb-header">工作台</div>
      <div class="wb-body" id="wb-body">
        <div class="wb-empty">工具调用将在这里实时显示</div>
      </div>
    </aside>
  </div>

  <script src="/static/vendor/marked.min.js"></script>
  <script src="/static/app.js?v=20261011t"></script>
</body>
</html>
